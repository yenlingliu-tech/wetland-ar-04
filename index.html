<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no">

  <title>濁水溪口｜四圖卡 AR 測試版</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
    }

    .ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .fixed-background {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      object-fit: contain;
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    #ar-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 85%;
      padding: 10px 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.75);
      color: white;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="ar-container">

  <!-- 四組背景 -->
  <img id="bg1" class="fixed-background"
    src="./background.png">

  <img id="bg2" class="fixed-background"
    src="./background2.png">

  <img id="bg3" class="fixed-background"
    src="./background3.png">

  <img id="bg4" class="fixed-background"
    src="./background4.png">

  <div id="status">正在初始化 AR...</div>

  <a-scene
    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      maxTrack: 1;
      uiLoading: true;
      uiScanning: true;
      filterMinCF: 0.001;
      filterBeta: 1000;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    background="color: #000000; transparent: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <!-- 只載入 PNG -->
    <a-assets timeout="15000">

      <!-- AR 01 -->
      <img id="mid1" src="./midground1.png">
      <img id="mid2" src="./midground2.png">
      <img id="front1" src="./foreground.png">

      <!-- AR 02 -->
      <img id="mid3" src="./midground3.png">

      <!-- AR 03 -->
      <img id="mid31" src="./midground3-1.png">
      <img id="front3" src="./foreground3.png">

      <!-- AR 04 -->
      <img id="mid4" src="./midground4.png">

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- AR 01 -->
    <a-entity
      id="target1"
      mindar-image-target="targetIndex: 0">

      <a-image
        src="#mid1"
        position="0 0 0.01"
        width="1.6"
        height="0.9"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

      <a-image
        src="#mid2"
        position="0 0 0.02"
        width="1.6"
        height="0.9"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

      <a-image
        src="#front1"
        position="0 0 0.03"
        width="1.6"
        height="0.9"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

    </a-entity>

    <!-- AR 02 -->
    <a-entity
      id="target2"
      mindar-image-target="targetIndex: 1">

      <a-image
        src="#mid3"
        position="0 0 0.01"
        width="1.6"
        height="0.9"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

    </a-entity>

    <!-- AR 03 -->
    <a-entity
      id="target3"
      mindar-image-target="targetIndex: 2">

      <a-image
        src="#mid31"
        position="0 0 0.08"
        width="1.1"
        height="0.75"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

      <a-image
        src="#front3"
        position="0.25 -0.15 0.18"
        width="0.65"
        height="0.6"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

    </a-entity>

    <!-- AR 04 -->
    <a-entity
      id="target4"
      mindar-image-target="targetIndex: 3">

      <a-image
        src="#mid4"
        position="0 0 0.08"
        width="1.1"
        height="0.75"
        material="shader: flat;
                  transparent: true;
                  depthWrite: false">
      </a-image>

    </a-entity>

  </a-scene>

</div>

<script>
  const statusBox = document.getElementById("status");
  const scene = document.getElementById("ar-scene");

  const backgrounds = [
    document.getElementById("bg1"),
    document.getElementById("bg2"),
    document.getElementById("bg3"),
    document.getElementById("bg4")
  ];

  const targets = [
    document.getElementById("target1"),
    document.getElementById("target2"),
    document.getElementById("target3"),
    document.getElementById("target4")
  ];

  const activeTargets = new Set();

  function updateBackground() {
    backgrounds.forEach(bg => {
      bg.style.display = "none";
    });

    const active = [...activeTargets].pop();

    if (active !== undefined) {
      backgrounds[active].style.display = "block";
      statusBox.textContent =
        "辨識成功！AR " + (active + 1);
    } else {
      statusBox.textContent = "請對準 AR 圖卡";
    }
  }

  // 監聽 MindAR 啟動
  scene.addEventListener("arReady", () => {
    statusBox.textContent =
      "AR 已啟動，請對準圖卡";
  });

  // 監聽 MindAR 錯誤
  scene.addEventListener("arError", () => {
    statusBox.textContent =
      "AR 啟動失敗，請檢查相機權限";
  });

  // 四組辨識事件
  targets.forEach((target, index) => {

    target.addEventListener("targetFound", () => {
      activeTargets.add(index);
      updateBackground();
    });

    target.addEventListener("targetLost", () => {
      activeTargets.delete(index);
      updateBackground();
    });

  });

  // 圖片載入錯誤提示
  document.querySelectorAll("img").forEach(img => {
    img.addEventListener("error", () => {
      statusBox.textContent =
        "圖片載入失敗：" +
        img.getAttribute("src");
    });
  });

  // PNG 資源載入完成
  document.querySelector("a-assets")
    .addEventListener("loaded", () => {
      if (statusBox.textContent === "正在初始化 AR...") {
        statusBox.textContent =
          "PNG 已載入，正在啟動相機...";
      }
    });

</script>

</body>
</html>
