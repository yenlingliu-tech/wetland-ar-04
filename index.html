<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>濁水溪口｜東方白鸛 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="ar-container">
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="background" src="background.png" />
        <img id="midground1" src="midground1.png" />
        <img id="midground2" src="midground2.png" />
        <img id="foreground" src="foreground.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex 0 代表你的第一張辨識圖 -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- 最後方：background（不動） -->
        <a-image
          src="#background"
          position="0 0 0"
          width="1.6"
          height="0.9"
          transparent="true">
        </a-image>

        <!-- 第二層：midground1（右到左平移） -->
        <a-image
          src="#midground1"
          position="0.08 0 0.01"
          width="1.6"
          height="0.9"
          transparent="true"
          animation="property: position; from: 0.08 0 0.01; to: -0.08 0 0.01; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine">
        </a-image>

        <!-- 第三層：midground2（不動） -->
        <a-image
          src="#midground2"
          position="0 0 0.02"
          width="1.6"
          height="0.9"
          transparent="true">
        </a-image>

        <!-- 最前方：foreground（右到左平移） -->
        <a-image
          src="#foreground"
          position="0.12 0 0.03"
          width="1.6"
          height="0.9"
          transparent="true"
          animation="property: position; from: 0.12 0 0.03; to: -0.12 0 0.03; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
        </a-image>

      </a-entity>
    </a-scene>
  </div>
</body>
</html>
