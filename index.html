<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no">

  <title>濁水溪口｜四圖卡辨識診斷</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #debug {
      position: fixed;
      top: 12px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(0,0,0,0.8);
      color: white;
      border-radius: 10px;
      z-index: 9999;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
    }

    .ok {
      color: #80ffb0;
    }

    .error {
      color: #ff9292;
    }
  </style>
</head>

<body>

  <!-- 辨識狀態顯示 -->
  <div id="debug">
    <div id="arStatus">
      AR 狀態：正在初始化
    </div>

    <div id="fileStatus">
      辨識檔：正在檢查
    </div>

    <div id="targetStatus">
      辨識結果：尚未辨識
    </div>
  </div>

  <a-scene
    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind?v=debug4_01;
      autoStart: true;
      maxTrack: 1;
      uiLoading: no;
      uiScanning: no;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 圖卡 1：紅色測試方塊 -->
    <a-entity
      id="target0"
      mindar-image-target="targetIndex: 0">

      <a-plane
        color="#ff4444"
        position="0 0 0.05"
        width="0.7"
        height="0.4"
        material="opacity: 0.75;
                  transparent: true;
                  side: double">
      </a-plane>

    </a-entity>

    <!-- 圖卡 2：綠色測試方塊 -->
    <a-entity
      id="target1"
      mindar-image-target="targetIndex: 1">

      <a-plane
        color="#44ff44"
        position="0 0 0.05"
        width="0.7"
        height="0.4"
        material="opacity: 0.75;
                  transparent: true;
                  side: double">
      </a-plane>

    </a-entity>

    <!-- 圖卡 3：藍色測試方塊 -->
    <a-entity
      id="target2"
      mindar-image-target="targetIndex: 2">

      <a-plane
        color="#4488ff"
        position="0 0 0.05"
        width="0.7"
        height="0.4"
        material="opacity: 0.75;
                  transparent: true;
                  side: double">
      </a-plane>

    </a-entity>

    <!-- 圖卡 4：黃色測試方塊 -->
    <a-entity
      id="target3"
      mindar-image-target="targetIndex: 3">

      <a-plane
        color="#ffff44"
        position="0 0 0.05"
        width="0.7"
        height="0.4"
        material="opacity: 0.75;
                  transparent: true;
                  side: double">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.getElementById("scene");

    const arStatus =
      document.getElementById("arStatus");

    const fileStatus =
      document.getElementById("fileStatus");

    const targetStatus =
      document.getElementById("targetStatus");

    // MindAR 啟動成功
    scene.addEventListener("arReady", () => {
      arStatus.textContent =
        "AR 狀態：已啟動，請掃描圖卡";

      arStatus.className = "ok";
    });

    // MindAR 啟動失敗
    scene.addEventListener("arError", () => {
      arStatus.textContent =
        "AR 狀態：啟動錯誤";

      arStatus.className = "error";
    });

    // 四張圖卡
    for (let i = 0; i < 4; i++) {

      const target =
        document.getElementById("target" + i);

      target.addEventListener("targetFound", () => {
        targetStatus.textContent =
          "辨識成功！targetIndex: " + i;

        targetStatus.className = "ok";

        console.log("辨識成功：", i);
      });

      target.addEventListener("targetLost", () => {
        targetStatus.textContent =
          "圖卡 " + (i + 1) + " 已離開鏡頭";

        targetStatus.className = "";
      });
    }

    // 檢查 targets.mind 是否能下載，
    // 並嘗試讀取 MindAR v2 格式中的圖卡數量
    async function checkTargetsFile() {

      try {
        const response = await fetch(
          "./targets.mind?v=debug4_01"
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const buffer = await response.arrayBuffer();
        const bytes = new Uint8Array(buffer);

        const size =
          (buffer.byteLength / 1024 / 1024).toFixed(2);

        let count = null;

        // 適用於目前 MindAR 編譯器的 v2 檔頭
        if (
          bytes.length > 16 &&
          bytes[0] === 0x82 &&
          bytes[1] === 0xa1 &&
          bytes[2] === 0x76 &&
          bytes[3] === 2 &&
          bytes[4] === 0xa8
        ) {
          const marker = bytes[13];

          if (marker >= 0x90 && marker <= 0x9f) {
            count = marker - 0x90;
          }
        }

        if (count !== null) {
          fileStatus.textContent =
            "辨識檔：" + size +
            " MB，包含 " + count + " 張圖卡";

          fileStatus.className =
            count === 4 ? "ok" : "error";
        } else {
          fileStatus.textContent =
            "辨識檔：已取得 " + size +
            " MB，圖卡數量無法判讀";
        }

      } catch (error) {
        fileStatus.textContent =
          "辨識檔讀取失敗：" + error.message;

        fileStatus.className = "error";

        console.error(error);
      }
    }

    checkTargetsFile();

    window.addEventListener("unhandledrejection", e => {
      console.error("非同步錯誤：", e.reason);

      arStatus.textContent =
        "程式發生錯誤，請查看主控台";

      arStatus.className = "error";
    });

  </script>

</body>
</html>
